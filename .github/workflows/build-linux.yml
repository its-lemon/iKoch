name: Build Linux (AppImage & deb)

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libpipewire-0.3-dev \
            libpulse-dev \
            libasound2-dev \
            libxdo-dev \
            ffmpeg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --exclude core-mux -- --skip mf_source_reader
        # Note: core-mux tests needing GStreamer AAC encoder run if plugins are present; run full suite:
        continue-on-error: true

      - name: Run core-types & recorder-daemon tests
        run: cargo test -p core-types -p core-encode -p recorder-daemon

      - name: Prepare FFmpeg sidecar symlinks for Tauri bundle
        run: |
          mkdir -p src-tauri/binaries
          ln -sf "$(which ffmpeg)" src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          ln -sf "$(which ffprobe)" src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu

      - name: Build Tauri Linux bundles (.deb & .AppImage)
        run: npx tauri build --bundles deb,appimage

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: ikoch-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
