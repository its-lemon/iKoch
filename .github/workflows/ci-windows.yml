name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install root JS dependencies & build app frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Install website JS dependencies & build website
        working-directory: website
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Create placeholder ffmpeg/ffprobe sidecars for tauri-build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          New-Item -ItemType File -Force -Path "src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe" | Out-Null
          New-Item -ItemType File -Force -Path "src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Cargo test
        run: cargo test --workspace
