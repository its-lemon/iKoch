[workspace]
resolver = "2"
members = [
    "crates/core-types",
    "crates/core-capture",
    "crates/core-encode",
    "crates/core-audio",
    "crates/core-mux",
    "crates/recorder-daemon",
    "src-tauri",
]
default-members = ["crates/recorder-daemon"]

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Serialization & errors
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Concurrency & logging
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Identifiers & time
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Windows APIs (WGC, Direct3D 11, DXGI, Media Foundation, WASAPI, Process/Window monitoring)
windows = { version = "0.62.2", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Audio capture, resampling & sound cues
wasapi = "0.27"
rubato = "5.1"
nnnoiseless = { version = "0.5", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "vorbis", "mp3"] }

# Daemon utilities
global-hotkey = "0.10"

# Desktop shell & Tray (Tauri v2)
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-single-instance = "2"

# Internal workspace crates
core-types = { path = "crates/core-types" }
core-capture = { path = "crates/core-capture" }
core-encode = { path = "crates/core-encode" }
core-audio = { path = "crates/core-audio" }
core-mux = { path = "crates/core-mux" }
recorder-daemon = { path = "crates/recorder-daemon" }
